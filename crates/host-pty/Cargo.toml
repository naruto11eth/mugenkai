[package]
name = "host-pty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# nix::pty::forkpty + raw fd handling needs unsafe.
[lints.rust]
unused_imports = "warn"
unused_variables = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
nix = { version = "0.31", features = ["term", "fs", "signal"] }
tokio = { version = "1.42", features = ["net", "rt", "io-util", "macros", "time"] }
thiserror = "2"
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.42", features = ["rt", "macros", "time", "io-util"] }
