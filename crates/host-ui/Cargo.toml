[package]
name = "host-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
host-core = { path = "../host-core" }
host-ghostty = { path = "../host-ghostty" }
host-pty = { path = "../host-pty" }
host-renderer = { path = "../host-renderer" }
gtk4 = { version = "0.9", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
tokio = { version = "1.42", features = ["rt", "macros", "io-util", "time", "sync"] }
serde_json = "1.0"
base64 = "0.22"
async-channel = "2.3"
# Used to re-encode pasted/dropped images that exceed Anthropic's
# 5 MB per-image limit. Default features cover PNG/JPEG/WebP/GIF
# decoding, which matches what users typically drag from a browser
# or screenshot tool.
image = "0.25"

[dev-dependencies]
